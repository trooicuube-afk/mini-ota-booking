version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: miniota-postgres
    environment:
      POSTGRES_DB: miniota
      POSTGRES_USER: miniota
      POSTGRES_PASSWORD: miniota
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - miniota-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniota -d miniota"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: miniota-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  miniota-pgdata:
